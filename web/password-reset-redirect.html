<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset - FTC HUB</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .icon-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
        }

        .icon-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.35);
            animation: scaleIn 0.5s ease-out;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .icon-circle svg {
            width: 60px;
            height: 60px;
            fill: white;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 16px;
            color: #718096;
            margin-bottom: 24px;
        }

        .message {
            background: #f7fafc;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            color: #4a5568;
            font-size: 15px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 30px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
        }

        .footer-text {
            font-size: 12px;
            color: #a0aec0;
        }

        @media (max-width: 480px) {
            .container { padding: 32px; }
            h1 { font-size: 24px; }
            .icon-container {
                width: 100px;
                height: 100px;
            }
            .icon-circle {
                width: 100px;
                height: 100px;
            }
            .icon-circle svg {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Icon -->
        <div class="icon-container">
            <div class="icon-circle">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 15V17M6 21H18C19.1046 21 20 20.1046 20 19V5C20 3.89543 19.1046 3 18 3H6C4.89543 3 4 3.89543 4 5V19C4 20.1046 4.89543 21 6 21ZM16 11C16 13.2091 14.2091 15 12 15C9.79086 15 8 13.2091 8 11C8 8.79086 9.79086 7 12 7C14.2091 7 16 8.79086 16 11Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </div>
        </div>

        <h1>Password Reset</h1>
        <p class="subtitle">Redirecting you to the app...</p>

        <div class="message">
            <p><strong>Password reset link detected!</strong><br><br>
            Opening the FTC HUB app to complete your password reset...</p>
        </div>

        <div class="footer">
            <p class="footer-text">FTC HUB - DECODE 2025-2026</p>
        </div>
    </div>

    <script>
        (function() {
            // Extract all URL parameters (both query string and hash fragment)
            const urlParams = new URLSearchParams(window.location.search);
            const hash = window.location.hash.substring(1); // Remove the #
            const hashParams = new URLSearchParams(hash);
            
            // Build the deep link URL for password reset
            let deepLink = 'ftchub://auth-callback';
            const params = [];
            
            // Check if this is a password reset (recovery) link
            const isRecovery = urlParams.get('type') === 'recovery' || 
                              hashParams.get('type') === 'recovery' ||
                              window.location.href.toLowerCase().includes('recovery') ||
                              window.location.href.toLowerCase().includes('reset');
            
            // Get all query parameters
            for (const [key, value] of urlParams.entries()) {
                params.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
            }
            
            // Get all hash fragment parameters (Supabase often puts tokens here)
            for (const [key, value] of hashParams.entries()) {
                params.push(encodeURIComponent(key) + '=' + encodeURIComponent(value));
            }
            
            // If we have parameters, append them
            if (params.length > 0) {
                deepLink += '?' + params.join('&');
            } else if (hash) {
                // If there's a hash but no params, append it directly
                deepLink += '#' + hash;
            }
            
            // Ensure type=recovery is in the URL if this is a recovery link
            if (isRecovery && !deepLink.includes('type=recovery') && !deepLink.includes('type%3Drecovery')) {
                if (deepLink.includes('?')) {
                    deepLink += '&type=recovery';
                } else {
                    deepLink += '?type=recovery';
                }
            }
            
            console.log('Password reset - Redirecting to:', deepLink);
            
            // Try to open the app immediately
            window.location.href = deepLink;
            
            // Fallback: If app doesn't open within 2 seconds, show instructions
            setTimeout(function() {
                const messageDiv = document.querySelector('.message');
                if (messageDiv) {
                    messageDiv.innerHTML = '<p><strong>Password Reset Link Detected!</strong><br><br>If the app didn\'t open automatically, please return to the FTC HUB app and try the password reset process again.</p>';
                }
            }, 2000);
        })();
    </script>
</body>
</html>
